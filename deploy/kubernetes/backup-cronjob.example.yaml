# Replace REGION, PROJECT_ID and GRAPHRAG_BACKUP_BUCKET. Apply after validating
# one manual backup and restore in a non-production tenant.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: graphrag-backup-default-tenant
  namespace: graphrag
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: graphrag-workload
          restartPolicy: OnFailure
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: backup
              image: REGION-docker.pkg.dev/PROJECT_ID/graphrag/backup:TAG
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  python scripts/kg_backup.py backup --tenant default
                  --output "gs://GRAPHRAG_BACKUP_BUCKET/default/$(date +%Y-%m-%dT%H-%M-%SZ).ndjson"
              envFrom:
                - configMapRef: {name: graphrag-config}
                - secretRef: {name: graphrag-secrets}
              resources:
                requests: {cpu: 500m, memory: 1Gi}
                limits: {cpu: "2", memory: 3Gi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
