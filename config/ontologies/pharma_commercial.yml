# Synthetic commercial-pharma demonstration ontology.
#
# This is deliberately not a clinical ontology and contains no patient data,
# real products, real claims, or prescribing guidance. It models the
# commercial-content governance question used by docs/pharma-commercial-demo.md.

ontology:
  id: synthetic-pharma-commercial
  version: "1.0.0"
  status: active
  compatible_with: ">=1.0.0"
  deprecated_types: []
  deprecated_relations: []

type_hierarchy:
  - [PHARMA_PRODUCT, PRODUCT]
  - [INDICATION, CONCEPT]
  - [MEDICAL_SPECIALTY, CONCEPT]
  - [COMMERCIAL_CONTENT, CONCEPT]
  - [MEDICAL_CLAIM, CONCEPT]
  - [COMMERCIAL_POLICY, CONCEPT]
  - [CONTENT_LIBRARY, CONCEPT]
  - [HCP_INTERACTION, EVENT]
  - [COMMERCIAL_CAMPAIGN, EVENT]
  - [MARKET, LOCATION]

relation_rules:
  TREATS:
    domain: [PHARMA_PRODUCT]
    target: [INDICATION]
    note: "Synthetic product-to-indication relationship; not a medical claim."
  SPECIALIZES_IN:
    domain: [PERSON]
    target: [MEDICAL_SPECIALTY]
  SUPPORTED_BY:
    domain: [MEDICAL_CLAIM]
    target: [COMMERCIAL_CONTENT]
    note: "A commercial claim must be backed by controlled content."
  APPROVED_FOR:
    domain: [COMMERCIAL_CONTENT]
    target: [MARKET, INDICATION, MEDICAL_SPECIALTY]
    note: "Content approval scope is market, indication, and HCP specialty."
  APPLIES_TO:
    domain: [COMMERCIAL_POLICY]
    target: [COMMERCIAL_CONTENT, PHARMA_PRODUCT, MARKET]
  GOVERNS:
    domain: [COMMERCIAL_POLICY]
    target: [COMMERCIAL_CAMPAIGN, HCP_INTERACTION, COMMERCIAL_CONTENT]
  USES_CONTENT:
    domain: [COMMERCIAL_CAMPAIGN, HCP_INTERACTION]
    target: [COMMERCIAL_CONTENT]
  SUPERSEDES:
    domain: [COMMERCIAL_CONTENT]
    target: [COMMERCIAL_CONTENT]

inference_rules:
  - name: content_supersession_transitivity
    relation: SUPERSEDES
    rule_type: transitivity
    max_depth: 3
    confidence_decay: 0.95
    note: "A later approved content revision transitively supersedes an earlier revision."

exclusive_state_pairs:
  - [CONTENT_APPROVED, CONTENT_EXPIRED]

functional_relations: []

authority_levels:
  - type: COMMERCIAL_POLICY
    level: 1
  - type: COMMERCIAL_CONTENT
    level: 2
  - type: COMMERCIAL_CAMPAIGN
    level: 3

document_prefixes:
  SYNTHETIC-POLICY-:
    type: COMMERCIAL_POLICY
    authority: 1
  SYNTHETIC-LABEL-:
    type: COMMERCIAL_CONTENT
    authority: 1
  SYNTHETIC-CLAIMS-:
    type: COMMERCIAL_CONTENT
    authority: 2
  SYNTHETIC-HCP-:
    type: COMMERCIAL_CONTENT
    authority: 3
  SYNTHETIC-CAMPAIGN-:
    type: COMMERCIAL_CAMPAIGN
    authority: 3
  SYNTHETIC-CONTENT-:
    type: COMMERCIAL_CONTENT
    authority: 2

supersession_chains:
  - predecessor: SYNTHETIC-CONTENT-CardioDemo-DE-expired-v1.txt
    successor: SYNTHETIC-CONTENT-CardioDemo-DE-approved-v2.txt
