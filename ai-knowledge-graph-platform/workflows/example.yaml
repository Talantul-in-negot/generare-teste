schema_version: "1.0"
id: graph-feature-delivery
title: Graph feature delivery
objective: Validate, test and review a graph feature before it is committed.
tasks:
  - id: lint
    title: Run Ruff
    kind: skill
    skill: lint
    metadata:
      paths:
        - graphrag/engineering_workflows
        - scripts/run_engineering_workflow.py
        - tests/unit/test_engineering_workflows.py

  - id: unit-tests
    title: Run unit tests
    kind: skill
    skill: unit-tests
    depends_on: [lint]

  - id: integration-tests
    title: Run integration tests
    kind: skill
    skill: integration-tests
    depends_on: [unit-tests]

  - id: human-review
    title: Confirm implementation is ready for repository review
    kind: command
    command: [python, -c, "print('Human review required before commit or push')"]
    depends_on: [integration-tests]
    approval_required: true
