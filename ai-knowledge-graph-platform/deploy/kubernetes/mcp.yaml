apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphrag-mcp
  namespace: graphrag
  labels:
    app.kubernetes.io/name: graphrag-mcp
    app.kubernetes.io/component: agent-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: graphrag-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphrag-mcp
        app.kubernetes.io/component: agent-gateway
    spec:
      serviceAccountName: graphrag-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: REGION-docker.pkg.dev/PROJECT_ID/graphrag/api:TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "mcp_server.remote"]
          ports:
            - containerPort: 8002
              name: mcp
          envFrom:
            - configMapRef: {name: graphrag-config}
            - secretRef: {name: graphrag-secrets}
          env:
            - name: GRAPHRAG_MCP_PORT
              value: "8002"
            - name: GRAPHRAG_MCP_MAX_REQUEST_BYTES
              value: "1048576"
            - name: TMPDIR
              value: /tmp
          readinessProbe:
            httpGet: {path: /health, port: mcp}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: mcp}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: graphrag-mcp
  namespace: graphrag
  labels:
    app.kubernetes.io/name: graphrag-mcp
spec:
  selector:
    app.kubernetes.io/name: graphrag-mcp
  # Streamable HTTP clients can have long-lived responses. Client affinity is
  # a conservative safety measure until MCP session state is externalized.
  sessionAffinity: ClientIP
  ports:
    - name: mcp
      port: 8002
      targetPort: mcp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: graphrag-mcp
  namespace: graphrag
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphrag-mcp
