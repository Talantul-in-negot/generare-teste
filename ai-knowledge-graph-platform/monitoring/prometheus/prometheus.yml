global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/graphrag-alerts.yml

scrape_configs:
  - job_name: graphrag-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/prometheus-metrics-token
    static_configs:
      - targets:
          - api:8000
