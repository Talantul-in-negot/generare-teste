# Prometheus alerting rules for the GraphRAG platform.
#
# Load with:
#   rule_files:
#     - /etc/prometheus/rules/graphrag-alerts.yml
#
# Design rules applied throughout:
#
# * **Alert on symptoms an operator can act on**, not on every metric that
#   exists. Each rule below names a specific action in its annotations; a rule
#   whose runbook step would be "look into it" is a dashboard panel, not a page.
# * **Absence is a symptom.** Several of these fire on work *not* happening
#   (a dead consumer, a stalled queue). Those cannot be caught by log-based
#   alerting, which is the main reason graphrag/observability/
#   operational_metrics.py exists.
# * **`for:` is not decoration.** Every threshold has a duration long enough to
#   survive a deploy, a GC pause, or a single slow query. A rule that fires on
#   one scrape trains people to ignore it.
# * Severity `page` means wake someone; `ticket` means it should be fixed but
#   not at 03:00. Nothing here is severity `warning`, because "warning" is
#   where alerts go to be filtered out.

groups:
  # ── Work being silently lost ───────────────────────────────────────────────
  - name: graphrag-work-loss
    interval: 30s
    rules:
      - alert: GraphRAGPublishFailures
        # The quietest failure mode in the system: the API returns 200 and the
        # job is simply never enqueued. Nothing downstream errors, because
        # nothing downstream ever sees it.
        expr: |
          sum(rate(graphrag_broker_publish_total{outcome="failure"}[5m])) by (exchange) > 0
        for: 2m
        labels:
          severity: page
          component: broker
        annotations:
          summary: "Publishes to {{ $labels.exchange }} are failing"
          description: >-
            Accepted API requests are not reaching the broker. Callers received
            success responses for work that will never run.
          action: >-
            Check broker reachability and channel-pool health from an API pod.
            Requests accepted during this window must be replayed; they are not
            retried automatically because they never entered a queue.

      - alert: GraphRAGDeadLetterGrowth
        # A DLQ receiving messages is work being permanently discarded.
        expr: |
          sum(increase(graphrag_broker_dlq_messages_total[15m])) by (queue, exception_type) > 0
        for: 5m
        labels:
          severity: page
          component: broker
        annotations:
          summary: "{{ $labels.queue }} is dead-lettering ({{ $labels.exception_type }})"
          description: >-
            Messages exhausted their retries and were discarded. Every one is a
            user-visible job that will not complete.
          action: >-
            Inspect the DLQ envelope for the failing payload shape. Fix the
            handler before replaying, or the replay dead-letters again.

  # ── Consumers dead or falling behind ───────────────────────────────────────
  - name: graphrag-queue-health
    interval: 30s
    rules:
      - alert: GraphRAGQueueAgeHigh
        # Age, not depth. Depth cannot distinguish a deep queue that is
        # draining from a shallow one that is stalled; age can, which is why
        # it is also the right autoscaling signal.
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(graphrag_broker_message_age_seconds_bucket[10m])) by (le, queue)
          ) > 300
        for: 10m
        labels:
          severity: page
          component: broker
        annotations:
          summary: "{{ $labels.queue }} p95 message age above 5 minutes"
          description: >-
            Messages are waiting materially longer than they are taking to
            process. Consumers are dead, too few, or blocked on a dependency.
          action: >-
            Check worker liveness first, then scale the consumer for this queue.
            If age keeps climbing after scaling, the handler is blocked
            downstream (graph or model provider), not under-provisioned.

      - alert: GraphRAGConsumerStalled
        # Fires on the *absence* of consumption while publishes continue.
        expr: |
          (sum(rate(graphrag_broker_publish_total{outcome="success"}[10m])) > 0)
          and
          (sum(rate(graphrag_broker_messages_consumed_total[10m])) == 0)
        for: 10m
        labels:
          severity: page
          component: worker
        annotations:
          summary: "Work is being published but nothing is consuming it"
          description: >-
            Publish rate is non-zero while consumption is flat at zero. No
            errors will appear anywhere for this state.
          action: "Restart the worker deployment; check its readiness probe and logs for a crash loop."

      - alert: GraphRAGRetryStorm
        expr: |
          sum(rate(graphrag_broker_message_retries_total[5m])) by (queue, exception_type) > 1
        for: 10m
        labels:
          severity: ticket
          component: broker
        annotations:
          summary: "{{ $labels.queue }} retrying heavily ({{ $labels.exception_type }})"
          description: >-
            Sustained retries burn provider quota and graph capacity on work
            that keeps failing, and precede dead-lettering.
          action: "Identify the failing dependency. Retrying a deterministic failure only delays the DLQ."

  # ── Graph database saturation ──────────────────────────────────────────────
  - name: graphrag-graph
    interval: 30s
    rules:
      - alert: GraphRAGConnectionPoolSaturated
        # Every query holds one pooled connection for its duration, so this
        # ratio is the hard ceiling on graph concurrency for the process.
        expr: |
          (
            graphrag_graph_pool_connections_in_use
            / clamp_min(graphrag_graph_pool_max_size, 1)
          ) > 0.9
        for: 5m
        labels:
          severity: page
          component: neo4j
        annotations:
          summary: "Neo4j connection pool above 90% occupancy"
          description: >-
            New queries are queuing for a connection. Latency will rise across
            every endpoint before any query actually errors.
          action: >-
            Find the slow query (graphrag_graph_query_duration_seconds p99).
            Raising the pool size hides the symptom if the cause is one
            unbounded traversal.

      - alert: GraphRAGGraphQueryFailures
        expr: |
          (
            sum(rate(graphrag_graph_queries_total{outcome="failure"}[5m]))
            / clamp_min(sum(rate(graphrag_graph_queries_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: page
          component: neo4j
        annotations:
          summary: "Over 5% of Neo4j queries are failing"
          action: "Check Neo4j availability, then disk and page-cache pressure."

  # ── Shared state silently degraded ─────────────────────────────────────────
  - name: graphrag-degradation
    interval: 30s
    rules:
      - alert: GraphRAGStoreDegraded
        # These fallbacks are deliberate, but each one silently changes
        # correctness across replicas: cache invalidation and token revocation
        # stop propagating. That must be alertable while it is happening.
        expr: max(graphrag_store_degraded) by (store) == 1
        for: 5m
        labels:
          severity: page
          component: redis
        annotations:
          summary: "{{ $labels.store }} has fallen back to per-process state"
          description: >-
            Shared state is unavailable, so this replica is diverging from its
            siblings. For query_cache a corrected answer keeps being served
            elsewhere; for token_revocation a revoked credential keeps working
            on other replicas.
          action: >-
            Restore Redis. Until then treat revocations and cache
            invalidations as not having taken effect fleet-wide.

  # ── Model providers ────────────────────────────────────────────────────────
  - name: graphrag-genai
    interval: 30s
    rules:
      - alert: GraphRAGModelErrorRate
        expr: |
          (
            sum(rate(graphrag_gen_ai_calls_total{outcome!="success"}[10m])) by (system)
            / clamp_min(sum(rate(graphrag_gen_ai_calls_total[10m])) by (system), 0.001)
          ) > 0.25
        for: 10m
        labels:
          severity: ticket
          component: genai
        annotations:
          summary: "{{ $labels.system }} failing over 25% of calls"
          description: >-
            The fallback chain absorbs this until the last provider also fails,
            so answers may still be served — at higher latency and cost.
          action: "Check provider status and quota. Confirm a downstream provider in the chain is healthy."

      - alert: GraphRAGModelLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(graphrag_gen_ai_client_operation_duration_seconds_bucket[10m])) by (le, system)
          ) > 30
        for: 15m
        labels:
          severity: ticket
          component: genai
        annotations:
          summary: "{{ $labels.system }} p95 latency above 30s"
          action: "Consider routing to the faster model tier; check whether prompts have grown."

  # ── API surface ────────────────────────────────────────────────────────────
  - name: graphrag-api
    interval: 30s
    rules:
      - alert: GraphRAGAPIErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          ) > 0.02
        for: 5m
        labels:
          severity: page
          component: api
        annotations:
          summary: "API 5xx rate above 2%"
          action: "Check /health/ready on each replica to identify which dependency is failing."

      - alert: GraphRAGAuthFailureSpike
        # Distinguishes a misconfigured client from credential stuffing only in
        # combination with source diversity — hence ticket, not page.
        expr: |
          sum(rate(http_requests_total{status="401"}[5m])) > 5
        for: 10m
        labels:
          severity: ticket
          component: auth
        annotations:
          summary: "Sustained 401 rate"
          description: >-
            Expected briefly after a signing-key rotation or an audience change
            (ADR 0010/0011). Unexpected otherwise.
          action: >-
            Correlate with recent config changes first. If none, check whether
            one client id is responsible and consider POST /auth/revoke.

  # ── SLO error-budget burn ─────────────────────────────────────────────────
  # Targets are intentionally kept in one place with docs/slo.md. These rules
  # use short/long windows so a brief spike and a sustained burn are both
  # visible without paging on one bad scrape.
  - name: graphrag-slo
    interval: 30s
    rules:
      - alert: GraphRAGQueryAvailabilityBurnFast
        expr: |
          (
            sum(rate(http_requests_total{handler="/query",status=~"5.."}[1h]))
            / clamp_min(sum(rate(http_requests_total{handler="/query",status!~"4.."}[1h])), 0.001)
          ) / 0.005 > 14.4
        for: 5m
        labels:
          severity: page
          component: slo
          slo: query-availability
        annotations:
          summary: "Query availability is burning its error budget rapidly"
          description: "The 1h 5xx burn rate is above 14.4x the 30-day 99.5% budget."
          action: "Check GraphRAGAPIErrorRate and /health/ready; stop feature rollout if the burn continues."

      - alert: GraphRAGQueryAvailabilityBurnSlow
        expr: |
          (
            sum(rate(http_requests_total{handler="/query",status=~"5.."}[6h]))
            / clamp_min(sum(rate(http_requests_total{handler="/query",status!~"4.."}[6h])), 0.001)
          ) / 0.005 > 6
        for: 15m
        labels:
          severity: ticket
          component: slo
          slo: query-availability
        annotations:
          summary: "Query availability is steadily consuming its error budget"
          description: "The 6h 5xx burn rate is above 6x the 30-day 99.5% budget."
          action: "Open a reliability ticket and review the affected dependency before the budget is exhausted."

      - alert: GraphRAGQueryLatencyBurnFast
        expr: |
          (
            1 - (
              sum(rate(http_request_duration_seconds_bucket{handler="/query",le="30"}[1h]))
              / clamp_min(sum(rate(http_request_duration_seconds_count{handler="/query"}[1h])), 0.001)
            )
          ) / 0.05 > 14.4
        for: 5m
        labels:
          severity: page
          component: slo
          slo: query-latency
        annotations:
          summary: "Query latency is burning its error budget rapidly"
          description: "More than the 5% 30-second latency budget is being consumed at a 14.4x burn rate."
          action: "Check GraphRAGModelLatencyHigh, Neo4j pool saturation, and queue age; shed load if needed."

      - alert: GraphRAGIngestionCompletenessBurn
        expr: |
          (
            sum(rate(graphrag_broker_dlq_messages_total{queue=~".*ingest.*"}[1h]))
            / clamp_min(sum(rate(graphrag_broker_messages_consumed_total{queue=~".*ingest.*"}[1h])), 0.001)
          ) / 0.001 > 14.4
        for: 5m
        labels:
          severity: page
          component: slo
          slo: ingestion-completeness
        annotations:
          summary: "Ingestion completeness is burning its error budget rapidly"
          description: "Dead-lettered ingestion work exceeds the 14.4x burn threshold for a 99.9% target."
          action: "Inspect the ingestion DLQ, fix the handler, then replay only after the cause is corrected."

      - alert: GraphRAGGroundednessBelowSLO
        expr: graphrag_evaluation_faithfulness{source="ragas"} < 0.8
        for: 15m
        labels:
          severity: ticket
          component: slo
          slo: answer-groundedness
        annotations:
          summary: "Latest RAGAS faithfulness is below the groundedness SLO"
          description: "The latest finite retrieval-backed evaluation is below the 0.80 quality gate."
          action: "Freeze retrieval changes and run the golden evaluation before promoting a new configuration."
