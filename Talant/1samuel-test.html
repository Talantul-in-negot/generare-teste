<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Talantul în negoț</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:linear-gradient(160deg,#160047,#3b0764 60%,#1e1b4b); min-height:100vh; padding:24px 14px 60px; }
  #app { max-width:820px; margin:0 auto; }
  .header { text-align:center; color:#fff; margin-bottom:22px; }
  .header h1 { font-size:1.5rem; font-weight:800; letter-spacing:.5px; }
  .header .subtitle { opacity:.85; margin-top:4px; font-size:.95rem; }
  section.block { background:rgba(255,255,255,.96); border-radius:18px; padding:22px 22px 26px; margin-bottom:22px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .sec-title { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .sec-title .roman { background:#7c3aed; color:#fff; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1rem; flex:none; }
  .sec-title h2 { font-size:1.05rem; color:#1a2a3a; }
  .sec-points { margin-left:auto; font-size:.78rem; font-weight:700; color:#7c3aed; background:#f3f0ff; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  .sec-instructions { font-size:.85rem; color:#555; margin:8px 0 16px; line-height:1.5; }

  .item { border-top:1px solid #eee; padding:14px 0; }
  .item:first-of-type { border-top:none; }
  .item-text { font-size:.95rem; color:#1a2a3a; line-height:1.55; margin-bottom:10px; }
  .item-ref { font-size:.75rem; color:#999; font-style:italic; margin-left:6px; }

  /* A/F pills */
  .af-row { display:flex; gap:10px; }
  .pill { flex:1; text-align:center; padding:10px; border-radius:12px; border:2.5px solid #c4b5fd; background:#f3f0ff; cursor:pointer; font-weight:700; color:#4c1d95; transition:.15s; user-select:none; }
  .pill:hover { border-color:#7c3aed; }
  .pill.sel { background:#7c3aed; border-color:#7c3aed; color:#fff; }

  /* single-choice options */
  .opt-list { display:flex; flex-direction:column; gap:8px; }
  .opt { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; border:2px solid #ddd6fe; background:#faf9ff; cursor:pointer; transition:.15s; }
  .opt:hover { border-color:#7c3aed; }
  .opt.sel { background:#ede9fe; border-color:#7c3aed; }
  .opt .letter { width:24px; height:24px; border-radius:50%; background:#c4b5fd; color:#fff; font-size:.78rem; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }
  .opt.sel .letter { background:#7c3aed; }
  .opt span.txt { font-size:.9rem; color:#1a2a3a; }

  /* matching (section III) */
  .match-row { display:flex; align-items:center; gap:14px; padding:10px 0; border-top:1px solid #eee; }
  .match-row:first-of-type { border-top:none; }
  .match-label { flex:0 0 130px; font-weight:700; color:#1a2a3a; font-size:.92rem; }
  .match-box { width:52px; height:52px; border:2.5px solid #c4b5fd; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.2rem; color:#7c3aed; cursor:pointer; background:#f3f0ff; flex:none; }
  .match-box.filled { background:#7c3aed; color:#fff; border-color:#7c3aed; }
  .match-picker { display:flex; gap:6px; flex-wrap:wrap; }
  .match-letter-btn { width:34px; height:34px; border-radius:8px; border:2px solid #c4b5fd; background:#fff; color:#7c3aed; font-weight:700; cursor:pointer; }
  .match-letter-btn.active { background:#7c3aed; color:#fff; }
  .match-legend { font-size:.85rem; color:#444; margin-top:4px; }
  .match-legend div { margin-bottom:4px; }
  .match-legend b { color:#7c3aed; }

  /* multi-select checkboxes (section IV) */
  .chk-list { display:flex; flex-direction:column; gap:8px; }
  .chk { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; border:2px solid #ddd6fe; background:#faf9ff; cursor:pointer; transition:.15s; }
  .chk:hover { border-color:#7c3aed; }
  .chk.sel { background:#ede9fe; border-color:#7c3aed; }
  .chk .box { width:22px; height:22px; border-radius:6px; border:2px solid #c4b5fd; display:flex; align-items:center; justify-content:center; flex:none; font-size:.75rem; font-weight:800; color:#fff; }
  .chk.sel .box { background:#7c3aed; border-color:#7c3aed; }

  .submit-wrap { text-align:center; margin-top:28px; }
  #submitBtn { padding:14px 34px; background:linear-gradient(135deg,#059669,#10b981); color:#fff; border:none; border-radius:14px; font-size:1.05rem; font-weight:800; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  #submitBtn:hover { opacity:.9; }
  #submitBtn:disabled { opacity:.5; cursor:not-allowed; }

  .result-card { background:rgba(255,255,255,.97); border-radius:18px; padding:26px; margin-top:20px; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .result-card h2 { color:#1a2a3a; margin-bottom:14px; }
  .result-row { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid #eee; font-size:.95rem; color:#333; }
  .result-row:first-of-type { border-top:none; }
  .result-row.total { font-weight:800; color:#059669; font-size:1.1rem; border-top:2px solid #ddd; margin-top:6px; padding-top:12px; }
  .item.answered-correct .item-text { color:#059669; }
  .item.answered-wrong .item-text { color:#dc2626; }
  .correction { font-size:.8rem; margin-top:6px; font-weight:600; }
  .correction.ok { color:#059669; }
  .correction.bad { color:#dc2626; }

  #accountBar { position:fixed; top:14px; left:14px; z-index:20; display:flex; gap:6px; flex-wrap:wrap; }
  .account-btn { background:rgba(0,0,0,.38); backdrop-filter:blur(8px); color:#fff; border:0; padding:7px 14px; border-radius:20px; font-size:.82rem; font-weight:700; cursor:pointer; }
  #syncNotice { position:fixed; top:52px; left:14px; z-index:20; color:#d8b4fe; font-size:.78rem; max-width:280px; }
  .modal-backdrop { position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:18px; background:rgba(0,0,0,.6); }
  .modal-backdrop[hidden] { display:none; }
  .modal { width:min(100%,560px); max-height:min(86vh,720px); overflow:auto; background:#fff; color:#1a2a3a; border-radius:20px; padding:24px; box-shadow:0 20px 70px rgba(0,0,0,.45); }
  .modal h2 { color:#6d28d9; font-size:1.35rem; margin-bottom:14px; }
  .modal input { width:100%; margin:6px 0; padding:11px 12px; border:1.5px solid #c4b5fd; border-radius:10px; font-size:.95rem; }
  .modal-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .modal-actions button { flex:1; min-width:140px; border:0; border-radius:10px; padding:11px; color:#fff; font-weight:700; cursor:pointer; background:#7c3aed; }
  .modal-actions .secondary { background:#64748b; }
  .modal-close { float:right; border:0; background:transparent; color:#64748b; font-size:1.4rem; cursor:pointer; }
  .auth-error { color:#b91c1c; min-height:1.25em; margin-top:8px; font-size:.88rem; }
  .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:12px 0 18px; }
  .stat { background:#f3f0ff; border-radius:10px; padding:10px; text-align:center; }
  .stat b { display:block; color:#6d28d9; font-size:1.15rem; }
  .leaderboard-row { display:grid; grid-template-columns:40px 1fr auto; gap:8px; align-items:center; padding:9px 0; border-bottom:1px solid #ede9fe; font-size:.9rem; }
  .leaderboard-row.me { background:#f3e8ff; margin:0 -8px; padding:9px 8px; border-radius:8px; }

  #testSwitcher { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 16px; }
  .test-pill { background:rgba(255,255,255,.14); color:#fff; border:1.5px solid rgba(255,255,255,.35); padding:7px 16px; border-radius:20px; font-size:.85rem; font-weight:700; cursor:pointer; text-decoration:none; transition:.15s; }
  .test-pill:hover { background:rgba(255,255,255,.24); }
  .test-pill.active { background:#fff; color:#6d28d9; border-color:#fff; }
</style>
</head>
<body>
<div id="accountBar">
  <button class="account-btn" id="userBtn" type="button">👤 <span id="userName">Conectează-te</span></button>
  <button class="account-btn" id="statsBtn" type="button">🏆 Clasament</button>
</div>
<p id="syncNotice" role="status" aria-live="polite"></p>
<div id="app">
  <div class="header">
    <h1 id="testTitle"></h1>
    <div class="subtitle" id="testSubtitle"></div>
  </div>
  <div id="testSwitcher"></div>
  <div id="sections"></div>
  <div class="submit-wrap">
    <button id="submitBtn">Finalizează testul</button>
  </div>
  <div id="resultBox"></div>
</div>

<div class="modal-backdrop" id="authModal" hidden>
  <section class="modal" aria-labelledby="authTitle">
    <button class="modal-close" id="authClose" type="button" aria-label="Închide">×</button>
    <h2 id="authTitle">Contul meu</h2>
    <p id="authIntro">Conectează-te ca să-ți salvezi rezultatul și să apari în clasament. Contul e comun cu celelalte teste Talant.</p>
    <div id="authForm">
      <input id="authUsername" maxlength="30" autocomplete="username" placeholder="Nume utilizator">
      <input id="authPassword" type="password" maxlength="64" autocomplete="current-password" placeholder="Parolă">
      <p class="auth-error" id="authError" role="alert"></p>
      <div class="modal-actions"><button id="loginBtn" type="button">Intră în cont</button></div>
    </div>
    <div id="authLogged" hidden>
      <p>Conectat ca <strong id="authLoggedName"></strong>.</p>
      <div class="modal-actions"><button id="logoutBtn" class="secondary" type="button">Ieși din cont</button></div>
    </div>
  </section>
</div>
<div class="modal-backdrop" id="statsModal" hidden>
  <section class="modal" aria-labelledby="statsTitle">
    <button class="modal-close" id="statsClose" type="button" aria-label="Închide">×</button>
    <h2 id="statsTitle">🏆 Clasament</h2>
    <div id="statsContent">Se încarcă…</div>
  </section>
</div>

<script src="data/1samuel-1-2.js?v=3"></script>
<script src="data/1samuel-3-4.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="test-tracker.js?v=3"></script>
<script>
// ── Fiecare test are propriul quiz_version → scor și clasament separate,
// deși toate folosesc același cont și aceleași tabele Supabase. ──
const TESTS = {
  'samuel1-2': { quizVersion: 'samuel1-2-v1', label: '1 Samuel 1-2', data: () => TEST_1SAMUEL },
  'samuel3-4': { quizVersion: 'samuel3-4-v1', label: '1 Samuel 3-4', data: () => TEST_1SAMUEL_3_4 },
};
const params = new URLSearchParams(location.search);
const activeTestId = TESTS[params.get('test')] ? params.get('test') : 'samuel1-2';
const activeTest = TESTS[activeTestId];
const QUIZ_VERSION = activeTest.quizVersion;
const DATA = activeTest.data();
const state = { af: {}, single: {}, match: {}, multi: {} };
let activeMatchRow = null;

document.getElementById('pageTitle').textContent = `Talantul în negoț – ${DATA.subtitle}`;
document.getElementById('testTitle').textContent = DATA.title;
document.getElementById('testSubtitle').textContent = DATA.subtitle;
document.getElementById('statsTitle').textContent = `🏆 Clasament — ${DATA.subtitle}`;
document.getElementById('testSwitcher').innerHTML = Object.entries(TESTS).map(([id, t]) =>
  `<a class="test-pill${id === activeTestId ? ' active' : ''}" href="?test=${id}">${t.label}</a>`
).join('');

const sectionsEl = document.getElementById('sections');

function romanBadge(id) { return id; }

DATA.sections.forEach(sec => {
  const block = document.createElement('section');
  block.className = 'block';

  const title = document.createElement('div');
  title.className = 'sec-title';
  title.innerHTML = `<div class="roman">${romanBadge(sec.id)}</div><h2></h2><div class="sec-points">${sec.points} p / întrebare</div>`;
  title.querySelector('h2').textContent = sectionHeading(sec);
  block.appendChild(title);

  const instr = document.createElement('div');
  instr.className = 'sec-instructions';
  instr.textContent = sec.instructions;
  block.appendChild(instr);

  if (sec.type === 'af') renderAF(sec, block);
  else if (sec.type === 'single') renderSingle(sec, block);
  else if (sec.type === 'match') renderMatch(sec, block);
  else if (sec.type === 'multi') renderMulti(sec, block);

  sectionsEl.appendChild(block);
});

function sectionHeading(sec) {
  if (sec.type === 'af') return 'Adevărat / Fals';
  if (sec.type === 'single') return 'Alegere unică (a/b/c)';
  if (sec.type === 'match') return 'Asociere';
  if (sec.type === 'multi') return 'Alegere multiplă';
  return '';
}

function renderAF(sec, block) {
  sec.items.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.dataset.sec = sec.id;
    div.dataset.idx = idx;
    div.innerHTML = `
      <div class="item-text">${idx + 1}. ${item.text}<span class="item-ref">${item.ref}</span></div>
      <div class="af-row">
        <div class="pill" data-val="A">A (Adevărat)</div>
        <div class="pill" data-val="F">F (Fals)</div>
      </div>`;
    div.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', () => {
        div.querySelectorAll('.pill').forEach(p => p.classList.remove('sel'));
        pill.classList.add('sel');
        state.af[idx] = pill.dataset.val;
      });
    });
    block.appendChild(div);
  });
}

function renderSingle(sec, block) {
  sec.items.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<div class="item-text">${idx + 1}. ${item.text}<span class="item-ref">${item.ref}</span></div>`;
    const optList = document.createElement('div');
    optList.className = 'opt-list';
    item.options.forEach((optText, oi) => {
      const letter = String.fromCharCode(65 + oi);
      const opt = document.createElement('div');
      opt.className = 'opt';
      opt.innerHTML = `<div class="letter">${letter}</div><span class="txt">${optText}</span>`;
      opt.addEventListener('click', () => {
        optList.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
        opt.classList.add('sel');
        state.single[idx] = letter;
      });
      optList.appendChild(opt);
    });
    div.appendChild(optList);
    block.appendChild(div);
  });
}

function renderMatch(sec, block) {
  const legend = document.createElement('div');
  legend.className = 'match-legend';
  sec.right.forEach(r => {
    const d = document.createElement('div');
    d.innerHTML = `<b>${r.letter}.</b> ${r.text}`;
    legend.appendChild(d);
  });
  block.appendChild(legend);

  const wrap = document.createElement('div');
  wrap.style.marginTop = '14px';
  sec.left.forEach((l, idx) => {
    const row = document.createElement('div');
    row.className = 'match-row';
    row.innerHTML = `
      <div class="match-label">${idx + 1}. ${l.label}</div>
      <div class="match-box" data-idx="${idx}">?</div>
      <div class="match-picker" data-idx="${idx}"></div>`;
    const picker = row.querySelector('.match-picker');
    sec.right.forEach(r => {
      const btn = document.createElement('div');
      btn.className = 'match-letter-btn';
      btn.textContent = r.letter;
      btn.addEventListener('click', () => {
        state.match[idx] = r.letter;
        picker.querySelectorAll('.match-letter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const box = row.querySelector('.match-box');
        box.textContent = r.letter;
        box.classList.add('filled');
      });
      picker.appendChild(btn);
    });
    wrap.appendChild(row);
  });
  block.appendChild(wrap);
}

function renderMulti(sec, block) {
  sec.items.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<div class="item-text">${idx + 1}. ${item.text}<span class="item-ref">${item.ref}</span></div>`;
    const list = document.createElement('div');
    list.className = 'chk-list';
    state.multi[idx] = new Set();
    item.options.forEach((optText, oi) => {
      const letter = String.fromCharCode(65 + oi);
      const chk = document.createElement('div');
      chk.className = 'chk';
      chk.innerHTML = `<div class="box">${letter}</div><span class="txt">${optText}</span>`;
      chk.addEventListener('click', () => {
        const set = state.multi[idx];
        if (set.has(letter)) { set.delete(letter); chk.classList.remove('sel'); }
        else { set.add(letter); chk.classList.add('sel'); }
      });
      list.appendChild(chk);
    });
    div.appendChild(list);
    block.appendChild(div);
  });
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const results = [];
  let grandTotal = 0, grandMax = 0;

  DATA.sections.forEach(sec => {
    let earned = 0, max = 0, answered = 0, total = 0;
    if (sec.type === 'af') {
      total = sec.items.length;
      sec.items.forEach((item, idx) => {
        max += sec.points;
        if (state.af[idx]) {
          answered++;
          if (state.af[idx] === item.correct) earned += sec.points;
        }
      });
    } else if (sec.type === 'single') {
      total = sec.items.length;
      sec.items.forEach((item, idx) => {
        max += sec.points;
        if (state.single[idx]) {
          answered++;
          if (state.single[idx] === item.correct) earned += sec.points;
        }
      });
    } else if (sec.type === 'match') {
      total = sec.left.length;
      sec.left.forEach((l, idx) => {
        max += sec.points;
        if (state.match[idx]) {
          answered++;
          if (state.match[idx] === l.correct) earned += sec.points;
        }
      });
    } else if (sec.type === 'multi') {
      total = sec.items.length;
      sec.items.forEach((item, idx) => {
        max += sec.points;
        const chosen = Array.from(state.multi[idx] || []).sort();
        const correct = [...item.correct].sort();
        if (chosen.length) answered++;
        if (JSON.stringify(chosen) === JSON.stringify(correct)) earned += sec.points;
      });
    }
    grandTotal += earned;
    grandMax += max;
    results.push({ id: sec.id, heading: sectionHeading(sec), earned, max, answered, total });
  });

  const box = document.getElementById('resultBox');
  const sectionScores = Object.fromEntries(results.map(r => [r.id, { earned: r.earned, max: r.max }]));
  let saveNote = '';
  if (!accountUser) {
    saveNote = '<p style="margin-top:14px;color:#b91c1c;font-size:.85rem">Conectează-te înainte de a finaliza dacă vrei ca rezultatul să intre în clasament.</p>';
  } else {
    try {
      await TestTracker.record({ quiz_version: QUIZ_VERSION, total_points: grandTotal, max_points: grandMax, section_scores: sectionScores });
      saveNote = '<p style="margin-top:14px;color:#059669;font-size:.85rem">✅ Rezultat salvat în clasament.</p>';
    } catch (error) {
      saveNote = `<p style="margin-top:14px;color:#b91c1c;font-size:.85rem">Nu s-a salvat: ${error.message || 'eroare de conexiune'}</p>`;
    }
  }

  box.innerHTML = `<div class="result-card">
    <h2>Rezultat</h2>
    ${results.map(r => `<div class="result-row"><span>Categoria ${r.id} — ${r.heading} (${r.answered}/${r.total} răspunsuri date)</span><span>${r.earned} / ${r.max} p</span></div>`).join('')}
    <div class="result-row total"><span>Total</span><span>${grandTotal} / ${grandMax} p</span></div>
    ${saveNote}
  </div>`;
  box.scrollIntoView({ behavior: 'smooth' });
});

// ── Cont / clasament ──────────────────────────────────────
let accountUser = '';
function updateAccount() {
  document.getElementById('userName').textContent = accountUser || 'Conectează-te';
  document.getElementById('authForm').hidden = !!accountUser;
  document.getElementById('authLogged').hidden = !accountUser;
  document.getElementById('authLoggedName').textContent = accountUser;
}
function openAuth() { document.getElementById('authModal').hidden = false; document.getElementById('authError').textContent = ''; updateAccount(); }
function closeAuth() { document.getElementById('authModal').hidden = true; }
async function submitAuth(mode) {
  const error = document.getElementById('authError'), username = document.getElementById('authUsername').value, password = document.getElementById('authPassword').value;
  error.textContent = '';
  try {
    accountUser = mode === 'login' ? await Auth.signIn(username, password) : await Auth.signUp(username, password);
    updateAccount();
    await TestTracker.flush();
    closeAuth();
  } catch (e) { error.textContent = e.message; }
}
function text(tag, value, className) { const node = document.createElement(tag); if (className) node.className = className; node.textContent = value; return node; }
async function openStats() {
  const modal = document.getElementById('statsModal'), content = document.getElementById('statsContent');
  modal.hidden = false;
  content.replaceChildren(text('p', 'Se încarcă…'));
  try {
    const [stats, ranking] = await Promise.all([
      accountUser ? TestTracker.ownStats(QUIZ_VERSION) : null,
      TestTracker.leaderboard(QUIZ_VERSION),
    ]);
    content.replaceChildren();
    if (accountUser) {
      const grid = document.createElement('div'); grid.className = 'stats-grid';
      [['Cel mai bun scor', stats ? `${stats.best_points}/${stats.max_points}` : '—'], ['Încercări', stats?.attempts || 0]].forEach(([label, value]) => {
        const cell = text('div', '', 'stat'); cell.append(text('b', value)); cell.append(text('span', label)); grid.append(cell);
      });
      content.append(grid);
    } else {
      content.append(text('p', 'Conectează-te ca să-ți vezi propriul scor.'));
    }
    content.append(text('h3', 'Clasament'));
    if (!ranking || !ranking.length) content.append(text('p', 'Încă nu există rezultate în clasament.'));
    else ranking.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'leaderboard-row' + (entry.user_name === accountUser ? ' me' : '');
      row.append(text('span', `#${entry.rank}`), text('span', entry.user_name), text('strong', `${entry.best_points}/${entry.max_points} p`));
      content.append(row);
    });
  } catch {
    content.replaceChildren(text('p', 'Clasamentul are nevoie de internet. Încearcă din nou mai târziu.'));
  }
}
document.getElementById('userBtn').addEventListener('click', openAuth);
document.getElementById('authClose').addEventListener('click', closeAuth);
document.getElementById('statsBtn').addEventListener('click', openStats);
document.getElementById('statsClose').addEventListener('click', () => { document.getElementById('statsModal').hidden = true; });
document.getElementById('loginBtn').addEventListener('click', () => submitAuth('login'));
document.getElementById('logoutBtn').addEventListener('click', async () => { await Auth.signOut(); accountUser = ''; updateAccount(); });
document.getElementById('authModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeAuth(); });
document.getElementById('statsModal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.hidden = true; });
updateAccount();
Auth.init(async user => { accountUser = user || ''; updateAccount(); if (accountUser) await TestTracker.flush(); }).catch(() => updateAccount());
</script>
</body>
