global:
  resolve_timeout: 5m

route:
  receiver: log-only
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Safe local default: alerts remain visible in the Alertmanager UI. Replace
  # this with an authenticated production receiver (PagerDuty, Slack, email)
  # through deployment-managed secrets rather than committing credentials.
  - name: log-only
