version: 2

# docs/evaluation.md's Showpad engineering-rigor assessment (2026-08-08,
# Band 1) found no dependency vulnerability scanning at all -- no
# dependabot.yml, no renovate.json, no pip-audit/safety. This is that gap
# closed for GitHub's own native mechanism (no third-party service
# account needed, unlike a Snyk/Renovate-app integration would be).
#
# Does not, on its own, fix the separate "dependency locking is floating"
# finding in the same assessment (pyproject.toml's >= constraints, no
# poetry.lock/uv.lock) -- Dependabot opens PRs against declared version
# constraints and the unpinned requirements.txt; moving to a locked
# dependency manager is a larger, deliberately out-of-scope change here
# (a package-manager migration, not a config addition).
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
