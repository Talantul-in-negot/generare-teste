# Pin the Compose project name so renaming/moving this directory (or running
# `docker compose up` from a different cwd) doesn't change the derived
# project name and orphan the neo4j_data volume. See
# ai-knowledge-graph-platform's docker-compose.yml — this bit that comment
# with a real dated incident (2026-06-10). Not speculative caution.
name: sales-context-graph

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: scg_neo4j
    ports:
      # Host ports shifted by +1 (7475/7688) — the ai-knowledge-graph-platform
      # sibling project's graphrag_neo4j container already holds the standard
      # 7474/7687 on this machine. Container-internal ports are unchanged
      # (still 7474/7687), so the `api` service's bolt://neo4j:7687 (container-
      # to-container, same compose network) is unaffected.
      - "7475:7474"   # HTTP browser
      - "7688:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/scg_dev_local
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "scg_dev_local", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scg_redis
    ports:
      # Shifted from the 6379 default — same reasoning as neo4j's 7475/7688:
      # avoid clashing with another project's redis on this machine.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scg_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      INGESTION_QUEUE_ENABLED: "true"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

# No RabbitMQ/worker/queue services yet — ingestion starts as a synchronous
# API call. Add a queue when transcript backlog exceeds the freshness SLA
# (see docs/roadmap.md "When to add an ingestion worker" once written) — not
# before there's a measured reason. Redis (above) was added for a concrete,
# already-measured need (api/state.py's durable ingestion job store), not
# speculatively — this comment used to defer Redis entirely; that's the
# thing that changed.
# The worker service below is now the durable execution path; the historical
# comment above is retained only to explain why the queue was feature-flagged.

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scg_worker
    command: python -m src.ingestion.worker
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      INGESTION_QUEUE_ENABLED: "true"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
