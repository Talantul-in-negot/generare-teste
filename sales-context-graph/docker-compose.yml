# Pin the Compose project name so renaming/moving this directory (or running
# `docker compose up` from a different cwd) doesn't change the derived
# project name and orphan the neo4j_data volume. See
# ai-knowledge-graph-platform's docker-compose.yml — this bit that comment
# with a real dated incident (2026-06-10). Not speculative caution.
name: sales-context-graph

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: scg_neo4j
    ports:
      # Host ports shifted by +1 (7475/7688) — the ai-knowledge-graph-platform
      # sibling project's graphrag_neo4j container already holds the standard
      # 7474/7687 on this machine. Container-internal ports are unchanged
      # (still 7474/7687), so the `api` service's bolt://neo4j:7687 (container-
      # to-container, same compose network) is unaffected.
      - "7475:7474"   # HTTP browser
      - "7688:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/scg_dev_local
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "scg_dev_local", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scg_redis
    ports:
      # Shifted from the 6379 default — same reasoning as neo4j's 7475/7688:
      # avoid clashing with another project's redis on this machine.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scg_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      INGESTION_QUEUE_ENABLED: "true"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

# The API and worker run as separate processes. With
# INGESTION_QUEUE_ENABLED=true, routes enqueue accepted jobs and the worker
# owns retries, visibility-timeout recovery, DLQ handling and bounded
# concurrency. Set the flag to false for a synchronous local-only run.

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scg_worker
    command: python -m src.ingestion.worker
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      INGESTION_QUEUE_ENABLED: "true"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Phase 8 (docs/evaluation.md's full-implementation plan) -- added per
  # explicit stakeholder direction, not a measured-need trigger; see
  # docs/adr-0003-kafka-event-bus.md. `profiles: [kafka]` means neither of
  # these starts with a plain `docker compose up` -- only
  # `docker compose --profile kafka up` -- so the default local-dev
  # experience (and CI) is unaffected. Redis (queue.py/worker.py) remains
  # the default, recommended INGESTION_TRANSPORT; this is available, not
  # active, until an operator opts in.
  kafka:
    image: apache/kafka:3.8.0
    container_name: scg_kafka
    profiles: ["kafka"]
    ports:
      - "9095:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: ciWo7IWazngRchmPES6q5A
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Same "profiles: [qdrant]" opt-in shape as kafka above -- see
  # docs/adr-0004-qdrant-secondary-vector-store.md. Neo4j's native vector
  # index (contact_embeddings_v1) stays primary; this is an available,
  # optional secondary, not active by default.
  qdrant:
    # Pinned, not :latest -- caught directly during this deployment-readiness
    # pass (docs/evaluation.md, 2026-08-08): :latest drifted to server 1.19.0
    # sometime during this repo's own long-running dev session while
    # qdrant-client stayed pinned at 1.17.0 (requirements.lock.txt), and the
    # client refused to talk to a server more than one minor version ahead
    # -- broke tests/integration/test_qdrant_backend.py with no code change
    # on either side. v1.17.0 matches the client; bump both together.
    image: qdrant/qdrant:v1.17.0
    container_name: scg_qdrant
    profiles: ["qdrant"]
    ports:
      - "6335:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
