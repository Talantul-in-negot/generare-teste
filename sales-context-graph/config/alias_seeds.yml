# Curated aliases that cannot be derived from a canonical name.
#
# src/resolution/alias_derivation.py handles everything mechanical — legal
# suffixes, diacritics, punctuation, initialisms. Two categories are out of
# its reach by construction and land here instead:
#
#   1. Brand abbreviations that are not initialisms of the legal name.
#      "VW" is not derivable from "Volkswagen Group" (its initialism is "vg").
#   2. Former names after a rename or acquisition.
#      "Facebook" is not derivable from "Meta Platforms, Inc." at all.
#
# Matching is on the NORMALIZED form (see alias_derivation.normalize:
# lowercased, periods deleted, punctuation folded to spaces, "&" preserved).
# Keys here are matched against the canonical account name, also normalized.
#
# SCOPE: this is a demonstration seed, not a company database. It exists to
# prove the mechanism end-to-end and to make the sensitivity sweep's remaining
# failures resolvable. Production coverage should come from (a) the CRM's own
# fields — ticker symbol, DBA name, former name — and (b) captured human
# review decisions, which are labelled aliases by definition. Hand-maintaining
# this file does not scale and is not the plan.
#
# SAFETY: an alias that matches two accounts in one workspace resolves to
# neither (resolve_deterministic requires exactly one match), so a wrong entry
# degrades to human review rather than to a wrong link.

aliases:
  "volkswagen group":
    - vw
    - vw group
  "volkswagen group ag":
    - vw
    - vw group
  "meta platforms inc":
    - facebook
    - fb
  "alphabet inc":
    - google
  "bayerische motoren werke ag":
    - bmw group
  "general motors company":
    - gm co
